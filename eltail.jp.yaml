  - name: pak_menu_module  # 0xDA4570-0xDAB5F0: the boot-time Controller Pak manager (mainproc runs it before the scheduler)
    type: code
    start: 0xDA4570
    vram: 0x80100000
    bss_size: 0x280
    dir: pak_menu_module
    exclusive_ram_id: pak_menu
    symbol_name_format: $VRAM_$ROM
    subsegments:
      - [0xDA4570, c, pak_menu]  # its code (src/pak_menu_module/pak_menu.c)
      - [0xDA6510, data, DA4570]  # its data: images, palettes, lists, strings, and three variables the code writes (0x80107044-0x8010704C)
      - [0xDAB5C0, .data, pak_menu]  # empty: a variable the C defines goes after the module's data
      - [0xDAB5C0, .rodata, pak_menu]  # the entry's jump table
      - {start: 0xDAB5F0, type: bss, vram: 0x80107080, name: DA4570}  # the menu's state, 0x280 bytes
      - {start: 0xDAB5F0, type: .bss, vram: 0x80107300, name: pak_menu}  # empty: a zero-initialized variable the C defines goes after the state
  - name: title_overlay  # 0xDAB5F0-0xDC62B0: title overlay (game mode 3)
    type: code
    start: 0xDAB5F0
    vram: 0x8020C0D0
    bss_size: 0x34
    dir: title_overlay
    exclusive_ram_id: mode_overlay
    symbol_name_format: $VRAM_$ROM
    subsegments:
      - [0xDAB5F0, c, title_screen]  # the screen's logic (src/title_overlay/title_screen.c): three source files, each section padded to 16
      - [0xDAC190, c, title_menu]  # the drawing: TitleScreen_DrawMenu
      - [0xDAE420, c, title_fade]  # the fade: TitleScreen_UpdateFade, TitleScreen_DrawFade
      - [0xDAE700, .data, title_screen]
      - [0xDAE720, .data, title_menu]
      - [0xDAEA10, .data, title_fade]
      - [0xDAEA30, bin, art]  # its art: palettes, textures and the menu's encoded text (ROM spans)
      - [0xDC6250, .rodata, title_screen]  # TitleScreen_Step's jump table
      - [0xDC6270, .rodata, title_menu]  # TitleScreen_DrawMenu's jump table
      - [0xDC62B0, .rodata, title_fade]  # empty
      - { start: 0xDC62B0, type: .bss, vram: 0x80226D90, name: title_screen }
      - { start: 0xDC62B0, type: .bss, vram: 0x80226DB0, name: title_menu }
      - { start: 0xDC62B0, type: .bss, vram: 0x80226DC0, name: title_fade }
  - name: intro_overlay  # 0xDC62B0-0xE22690: splash and intro overlay (game mode 4)
    type: code
    start: 0xDC62B0
    vram: 0x8020C0D0
    bss_size: 0xEBD6
    dir: intro_overlay
    exclusive_ram_id: mode_overlay
    symbol_name_format: $VRAM_$ROM
    subsegments:
      - [0xDC62B0, c, intro]  # the entry, the state machine, the scene player, the 18 functions the ending also holds, the drawing
      - [0xDC9350, c, intro_screens]  # ten functions the state machine calls (the first file's last function ends with two padding words)
      - [0xDCC410, .data, intro]  # variables, display lists, the scene tables, the scene images (labelled ROM spans)
      - [0xE13430, .data, intro_screens]  # the images its functions draw (labelled ROM spans)
      - [0xE22660, .rodata, intro]  # a debug string and Intro_Update's jump table (splat migrates both into its assembly)
      - [0xE22690, .rodata, intro_screens]  # empty
      - { start: 0xE22690, type: .bss, vram: 0x802684B0, name: intro }
      - { start: 0xE22690, type: .bss, vram: 0x80277080, name: intro_screens }
