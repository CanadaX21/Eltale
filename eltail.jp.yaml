  - name: interiors_common  # 0x851F0-0xC8DE0: interiors common block (LoadMap loads it for maps with flags & 2: 13-25)
    type: code
    start: 0x851F0
    vram: 0x8010FE00  # D_8010FE00, where LoadMap loads it; the linker asserts it (undefined_syms.jp.txt: the lock)
    exclusive_ram_id: map_blob  # the outdoor map blobs load at this RAM instead
