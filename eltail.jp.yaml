name: Eltail (Japanese)
sha1: 4161b5c100ec82b0241b20ca8f81366e23564ccb
options:
  basename: eltail
  target_path: baserom.jp.z64
  base_path: .
  compiler: IDO
  find_file_boundaries: True
  header_encoding: ASCII
  platform: n64
  gfx_ucode: f3dex                  # the boss files' display lists (splat gfx segments): F3DEX 1.23
  data_string_guesser_level: 0      # .data stays words: boss keyframe floats are not strings
  generated_c_preamble: "#include \"common.h\"\n#include \"boss_files.h\""
  # undefined_funcs_auto: True
  # undefined_funcs_auto_path: undefined_funcs_auto.txt
  # undefined_syms_auto: True
  # undefined_syms_auto_path: undefined_syms_auto.txt
  # symbol_addrs_path: symbol_addrs.txt
  # asm_path: asm
  # src_path: src
  # build_path: build
  # extensions_path: tools/splat_ext
  # mips_abi_float_regs: o32
  # section_order: [".text", ".data", ".rodata", ".bss"]
  # auto_all_sections: [".data", ".rodata", ".bss"]
  # libultra_symbols: True
  # hardware_regs: True
segments:
  - name: header
    type: header
    start: 0x0
  - name: boot
    type: bin
    start: 0x40
  - name: main
    type: code
    start: 0x1000
    vram: 0x80000400
    bss_size: 0x261A0
    subsegments:
      # Every C unit has a .data, a .rodata and a .bss entry. One marked "empty" has no bytes in the original (it starts where the next entry does): it places the section a modified build may give that unit.
      - [0x1000, hasm, entry]  # the hand-written boot entry, kept in asm/ (splat writes a hasm file only when it is missing): its .bss clear size comes from the linker
      - [0x1050, c, game/boot]
      - [0x1130, c, sched/nnsched]
      - [0x1870, c, game/main]
