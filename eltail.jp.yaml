      - [0x709A0, bin, main_tail_3]
      - [0x709D0, data, main_tail_jtbl3]  # the SDK's jump tables: entries name their case labels
      - [0x70B00, bin, main_tail_4]
      - [0x70B20, data, main_tail_jtbl4]  # the SDK's jump tables: entries name their case labels
      - [0x70DB0, bin, main_tail_5]
      - [0x70E20, data, main_tail_jtbl5]  # the SDK's jump tables: entries name their case labels
      - [0x70E40, bin, main_tail_6]
  - name: segment1_gfx  # 0x71920-0x753F0: segment 1: shared display lists + textures
    type: code
    start: 0x71920
    vram: 0x80095AF0
    exclusive_ram_id: segment1
    symbol_name_format: $VRAM_$ROM
    subsegments:
      - [0x71920, bin, segment1_gfx_0]
      - [0x72C20, data, segment1_gfx_sky0]  # texture-image pointers into main's .bss
      - [0x73190, bin, segment1_gfx_1]
      - [0x73D30, data, segment1_gfx_sky1]  # texture-image pointers into main's .bss
      - [0x740D0, bin, segment1_gfx_2]
      - [0x74F50, data, segment1_gfx_sky2]  # texture-image pointers into main's .bss
      - [0x75300, bin, segment1_gfx_3]
  - name: gameplay_common  # 0x753F0-0x851F0: gameplay common block (LoadMap loads it for every map)
    type: code
    start: 0x753F0
    vram: 0x80100000  # D_80100000, where LoadMap loads it; the linker asserts it (undefined_syms.jp.txt: the lock)
    exclusive_ram_id: pak_menu  # the Controller Pak menu module loads at this RAM instead (mainproc)
    symbol_name_format: $VRAM_$ROM
    subsegments:
