  - name: main_tail  # 0x70550-0x71920: the main segment's tail: libultra .rodata
    type: code
    start: 0x70550
    vram: 0x80095AF0  # where the linker places this ROM piece; the boot copies it to the RAM after main's data (0x8006F950 as built), which this config models as main_bss, and the code reads it there
    exclusive_ram_id: main_tail
    symbol_name_format: $VRAM_$ROM
    subsegments:
      - [0x70550, bin, main_tail_0]
      - [0x706A0, data, main_tail_jtbl0]  # the SDK's jump tables: entries name their case labels
      - [0x708E0, bin, main_tail_1]
