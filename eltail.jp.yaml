      - [0xDC9350, c, intro_screens]  # ten functions the state machine calls (the first file's last function ends with two padding words)
      - [0xDCC410, .data, intro]  # variables, display lists, the scene tables, the scene images (labelled ROM spans)
      - [0xE13430, .data, intro_screens]  # the images its functions draw (labelled ROM spans)
      - [0xE22660, .rodata, intro]  # a debug string and Intro_Update's jump table (splat migrates both into its assembly)
      - [0xE22690, .rodata, intro_screens]  # empty
      - { start: 0xE22690, type: .bss, vram: 0x802684B0, name: intro }
